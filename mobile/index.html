<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Chord Web Mobile"/>
  <meta name="theme-color" content="#070914"/>
  <title>Chord Web Mobile</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <a class="ghost" href="../" aria-label="Desktop ChordWeb">🕸️</a>
      <div>
        <h1>Chord Web Mobile</h1>
        <p id="dataStatus">Load ChordWeb data to begin</p>
      </div>
      <button id="settingsJump" class="round" title="Controls">⚙️</button>
    </header>

    <section class="panel loaderPanel" id="loaderPanel">
      <div class="loaderText">
        <b>Data-first mobile version</b>
        <span>Uses the same spreadsheet layout as ChordWeb.</span>
      </div>
      <label class="fileBtn">Load .xlsx<input id="fileInput" type="file" accept=".xlsx,.xls"/></label>
      <div class="urlRow">
        <input id="dataUrl" type="url" placeholder="Optional .xlsx URL"/>
        <button id="loadUrlBtn">Load</button>
      </div>
    </section>

    <section id="controls" class="controls">
      <div class="viewTabs">
        <button id="cardsViewBtn" class="active">Cards</button>
        <button id="webViewBtn">Web</button>
        <button id="constViewBtn">Constellation</button>
      </div>

      <div class="fieldGrid">
        <label>Root
          <div class="withRand"><select id="rootSel"><option>Load data</option></select><button id="rootRnd" title="Random root">🎲</button></div>
        </label>
        <label>Base
          <div class="withRand"><select id="baseSel"><option>Any Base</option></select><button id="baseRnd" title="Random base">🎲</button></div>
        </label>
        <label>Sub
          <div class="withRand"><select id="subSel"><option>Any Sub</option></select><button id="subRnd" title="Random sub">🎲</button></div>
        </label>
        <label>Start
          <div class="withRand"><select id="startSel"><option value="">Optional</option></select><button id="startRnd" title="Random start">🎲</button></div>
        </label>
      </div>

      <div class="sliderGrid">
        <label>Count <input id="count" type="number" min="1" max="24" value="8"/></label>
        <label>Play speed <input id="playSpeed" type="range" min="250" max="2200" step="50" value="850"/><span id="speedReadout">850ms</span></label>
      </div>

      <div class="musicalityRow">
        <span>Friendly</span>
        <input id="spicy" type="range" min="0" max="100" value="0"/>
        <span>Scary</span>
      </div>
      <label class="check"><input id="noRepeat" type="checkbox" checked/> No repeat chords</label>

      <div class="soundRow">
        <select id="soundSelect"></select>
        <button id="randomSoundBtn" title="Random sound">🎲</button>
        <input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume"/>
      </div>

      <div class="actionRow">
        <button id="generateBtn" class="primary">Generate</button>
        <button id="playAllBtn">Play All</button>
        <button id="copyBtn">Copy</button>
      </div>
    </section>

    <section id="cards" class="cards"></section>

    <section id="mapPanel" class="mapPanel hidden">
      <div class="mapTools">
        <button id="zoomOut">−</button>
        <button id="zoomReset">Reset</button>
        <button id="zoomIn">+</button>
      </div>
      <svg id="webSvg" viewBox="0 0 900 700" aria-label="Chord Web view">
        <g id="webZoom"></g>
      </svg>
      <p id="mapHint">Tap a node to play it. Drag to pan.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
